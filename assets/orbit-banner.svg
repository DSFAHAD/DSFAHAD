<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020B14"/>
      <stop offset="0.5" stop-color="#0B3B52"/>
      <stop offset="1" stop-color="#04202F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FE9FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7FE9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <circle cx="700" cy="140" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;185;150" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- orbit rings -->
  <g transform="translate(700 140)">
    <ellipse rx="70" ry="110" fill="none" stroke="#7FE9FF" stroke-width="7" filter="url(#blur)" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="70" ry="110" fill="none" stroke="#E6FBFF" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="110" ry="40" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="6" fill="#7FE9FF">
      <animateMotion dur="6s" repeatCount="indefinite" path="M110,0 A110,40 0 1,1 -110,0 A110,40 0 1,1 110,0"/>
    </circle>
  </g>

  <!-- floating particles -->
  <g fill="#7FE9FF">
    <circle cx="80" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="250" r="2"><animate attributeName="cy" values="250;225;250" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="1.5"><animate attributeName="cy" values="40;70;40" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="250" r="2"><animate attributeName="cy" values="250;230;250" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="50" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#7FE9FF" opacity="0.9">DSFAHAD</text>
  <text x="50" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="10" fill="#FFFFFF">FAHAD
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="10" fill="#7FE9FF">HAMEED</text>
  <text x="52" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#BFEFFF">DATA SCIENCE · MACHINE LEARNING · ANALYTICS</text>

  <!-- stats strip -->
  <rect x="0" y="262" width="900" height="38" fill="#031018" opacity="0.85"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600" letter-spacing="2">
    <text x="50" y="286">350+ <tspan fill="#7FE9FF" font-size="10">DOWNLOADS</tspan></text>
    <text x="260" y="286">2 <tspan fill="#7FE9FF" font-size="10">PYPI LIBS</tspan></text>
    <text x="420" y="286">5+ <tspan fill="#7FE9FF" font-size="10">PROJECTS</tspan></text>
    <text x="590" y="286">LAHORE <tspan fill="#7FE9FF" font-size="10">PK</tspan></text>
  </g>
  <rect x="0" y="262" width="150" height="2" fill="#7FE9FF">
    <animate attributeName="x" values="-150;900" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
